<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 54" width="1200" height="54" role="presentation" aria-label="pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lt{fill:#c6ff3d;stroke:#0a0a0a;stroke-width:1;opacity:0;animation:fl 6s linear infinite}
    @keyframes fl{0%{opacity:1}14%{opacity:.2}34%,100%{opacity:0}}
    .pu{animation:run 6s linear infinite}
    @keyframes run{from{transform:translateX(0)}to{transform:translateX(900px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
<line x1="150" y1="16" x2="1050" y2="16" stroke="#6b6b60" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="2 6"/>
