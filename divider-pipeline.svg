  <rect x="368" y="9" width="14" height="14" fill="none" stroke="#6b6b60" stroke-width="1.6"/><rect class="lt" x="368" y="9" width="14" height="14" style="animation-delay:1.5s"/><text class="m" x="375" y="45" font-size="10" letter-spacing="3" fill="#6b6b60" text-anchor="middle">CODE</text>
  <rect x="593" y="9" width="14" height="14" fill="none" stroke="#6b6b60" stroke-width="1.6"/><rect class="lt" x="593" y="9" width="14" height="14" style="animation-delay:3.0s"/><text class="m" x="600" y="45" font-size="10" letter-spacing="3" fill="#6b6b60" text-anchor="middle">TEST</text>
  <rect x="818" y="9" width="14" height="14" fill="none" stroke="#6b6b60" stroke-width="1.6"/><rect class="lt" x="818" y="9" width="14" height="14" style="animation-delay:4.5s"/><text class="m" x="825" y="45" font-size="10" letter-spacing="3" fill="#6b6b60" text-anchor="middle">SHIP</text>
  <rect x="1043" y="9" width="14" height="14" fill="none" stroke="#6b6b60" stroke-width="1.6"/><rect class="lt" x="1043" y="9" width="14" height="14" style="animation-delay:6.0s"/><text class="m" x="1050" y="45" font-size="10" letter-spacing="3" fill="#6b6b60" text-anchor="middle">WATCH</text>
