<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Vineet Sahoo. I build the interface and the pipeline under it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
    .bone{fill:#ece6d6}.acid{fill:#c6ff3d}.dim{fill:#6b6b60}
    .node{fill:#0a0a0a;stroke:#6b6b60;stroke-width:2}
    .lit{fill:#c6ff3d;opacity:0;animation:flash 5s linear infinite}
    @keyframes flash{0%{opacity:1}12%{opacity:.15}30%,100%{opacity:0}}
    .pulse{animation:run 5s linear infinite}
    @keyframes run{from{transform:translateX(0)}to{transform:translateX(880px)}}
    .scan{animation:scan 7s ease-in-out infinite}
    @keyframes scan{0%,100%{transform:translateY(0);opacity:0}10%{opacity:.5}50%{transform:translateY(400px);opacity:.5}90%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.lit,.pulse,.scan,.cur{animation:none}.lit{opacity:0}}
  </style>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ece6d6" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#0a0a0a"/>
  <rect width="1200" height="400" fill="url(#g)"/>
  <rect class="scan" width="1200" height="2" fill="#c6ff3d" opacity="0"/>

  <!-- top rail -->
  <text x="48" y="52" class="mono bone" font-size="13" letter-spacing="3">VINEET SAHOO</text>
  <text x="1152" y="52" class="mono acid" font-size="13" letter-spacing="3" text-anchor="end">CHENNAI / IST</text>
  <line x1="48" y1="70" x2="1152" y2="70" stroke="#ece6d6" stroke-opacity=".18"/>

  <!-- headline -->
  <text x="48" y="150" class="sans bone" font-size="58" font-weight="700" letter-spacing="-1.5">I build the interface,</text>
  <text x="48" y="218" class="sans acid" font-size="58" font-weight="700" letter-spacing="-1.5">and the pipeline under it.</text>
  <rect class="cur acid" x="745" y="176" width="14" height="42"/>

  <!-- pipeline -->
  <line x1="80" y1="300" x2="960" y2="300" stroke="#6b6b60" stroke-width="2" stroke-dasharray="2 6"/>
  <g>
    <rect class="node" x="72" y="292" width="16" height="16"/><rect class="lit" x="72" y="292" width="16" height="16" style="animation-delay:0s"/>
    <rect class="node" x="292" y="292" width="16" height="16"/><rect class="lit" x="292" y="292" width="16" height="16" style="animation-delay:1.25s"/>
    <rect class="node" x="512" y="292" width="16" height="16"/><rect class="lit" x="512" y="292" width="16" height="16" style="animation-delay:2.5s"/>
    <rect class="node" x="732" y="292" width="16" height="16"/><rect class="lit" x="732" y="292" width="16" height="16" style="animation-delay:3.75s"/>
    <rect class="node" x="952" y="292" width="16" height="16"/><rect class="lit" x="952" y="292" width="16" height="16" style="animation-delay:5s"/>
  </g>
  <g class="mono dim" font-size="12" letter-spacing="2" text-anchor="middle">
    <text x="80" y="336">COMMIT</text><text x="300" y="336">TEST</text><text x="520" y="336">SCAN</text><text x="740" y="336">BUILD</text><text x="960" y="336">DEPLOY</text>
  </g>
  <g class="pulse"><circle cx="80" cy="300" r="5" fill="#c6ff3d"/><circle cx="80" cy="300" r="12" fill="#c6ff3d" opacity=".18"/></g>

  <!-- footer rail -->
  <text x="48" y="376" class="mono dim" font-size="12" letter-spacing="2">FRONTEND  /  AI SYSTEMS  /  CLOUD + DEVOPS</text>
  <text x="1152" y="376" class="mono dim" font-size="12" letter-spacing="2" text-anchor="end">HOW A CHANGE GETS OUT</text>
</svg>
