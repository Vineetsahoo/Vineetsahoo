<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Terminal sign-off: git commit -m built with intention. Shipped with precision." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .grp{animation:g 11.0s linear infinite}
    @keyframes g{0%,88%{opacity:1}94%,99.9%{opacity:0}100%{opacity:1}}
    .rv{transform-origin:454px 66px;animation:rv 11.0s linear infinite}
    @keyframes rv{0%,7%{transform:scaleX(1);animation-timing-function:steps(36,end)}33%,95%{transform:scaleX(0)}95.5%,100%{transform:scaleX(1)}}
    .l2{opacity:0;animation:l2 11.0s linear infinite}
    @keyframes l2{0%,36%{opacity:0}37%,100%{opacity:1}}
    .l3{opacity:0;animation:l3 11.0s linear infinite}
    @keyframes l3{0%,43%{opacity:0}44%,100%{opacity:1}}
    .cu{animation:b 1.1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.grp,.l2,.l3,.cu{animation:none!important}.l2,.l3,.grp{opacity:1}.rv{display:none}}
  </style>
  <rect width="1200" height="170" fill="#0a0a0a"/>
  <text class="m" x="48" y="30" font-size="11" letter-spacing="2" fill="#6b6b60">~/vineet-sahoo</text>
  <text class="m" x="1152" y="30" font-size="11" letter-spacing="2" fill="#6b6b60" text-anchor="end">main</text>
  <line x1="48" y1="42" x2="1152" y2="42" stroke="#6b6b60" stroke-opacity=".5" stroke-dasharray="2 6"/>
  <g class="grp">
    <text class="m" x="48" y="78" font-size="17" fill="#c6ff3d">$</text>
    <text class="m" x="74" y="78" font-size="17" fill="#ece6d6" textLength="367" lengthAdjust="spacing" xml:space="preserve">git commit -m "built with intention"</text>
    <rect class="rv" x="72" y="58" width="384" height="26" fill="#0a0a0a"/>
    <g class="l2">
      <text class="m" x="74" y="112" font-size="17" fill="#6b6b60">[main]</text>
      <text class="m" x="146" y="112" font-size="17" fill="#ece6d6">shipped with precision.</text>
      <rect x="1078" y="104" width="7" height="7" fill="#c6ff3d"/>
      <text class="m" x="1152" y="112" font-size="11" letter-spacing="2" fill="#6b6b60" text-anchor="end">EXIT 0</text>
    </g>
    <g class="l3">
      <text class="m" x="48" y="146" font-size="17" fill="#c6ff3d">$</text>
      <rect class="cu" x="74" y="132" width="10" height="17" fill="#c6ff3d"/>
      <text class="m" x="1152" y="146" font-size="11" letter-spacing="3" fill="#6b6b60" text-anchor="end">VINEET SAHOO</text>
    </g>
  </g>
</svg>
